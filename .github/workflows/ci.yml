---
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HUGO_VERSION: 0.163.1

jobs:
  lint:
    name: pre-commit (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  build:
    name: hugo build (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Hugo extended
        run: |
          curl -sSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: |
          output=$(hugo --minify 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "WARN|ERROR"; then
            echo "::error::Hugo build produced warnings or errors"
            exit 1
          fi
