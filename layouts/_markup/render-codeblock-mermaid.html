<pre class="mermaid">{{ .Inner | htmlEscape | safeHTML }}</pre>
{{- if not (.Page.Store.Get "hasMermaid") }}
{{- .Page.Store.Set "hasMermaid" true }}
{{- /* mermaid 11.15.0, self-hosted (vendored in assets/js/), fingerprinted + SRI */}}
{{- $mermaid := resources.Get "js/mermaid.min.js" | fingerprint }}
<script defer src="{{ $mermaid.RelPermalink }}" integrity="{{ $mermaid.Data.Integrity }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var dark = document.body.classList.contains("dark");
    mermaid.initialize({ startOnLoad: true, theme: dark ? "dark" : "default" });
  });
</script>
{{- end }}
