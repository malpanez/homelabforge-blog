baseURL = "https://blog.homelabforge.dev/"
title = "HomelabForge"
theme = "PaperMod"
enableRobotsTXT = true

[permalinks]
  posts = "/:slug/"

[taxonomies]
  tag = "tags"
  series = "series"

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    style = "github-dark"
    noClasses = true
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["html", "rss"]

[outputFormats]
  [outputFormats.rss]
    mediatype = "application/rss+xml"
    baseName = "rss"

[params]
  description = "Production DevOps for Homelabs"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = "HomelabForge"
    Content = "Production DevOps for Homelabs"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/malpanez"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/miguel-alpa%C3%B1ez/"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/malpanez"
  [[params.socialIcons]]
    name = "rss"
    url = "/rss.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
